name: Diagnose external source links
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check official source URLs
        run: python scripts/check_external_links.py --output external-links-result.json
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: external-source-link-diagnostic
          path: external-links-result.json
          if-no-files-found: warn
