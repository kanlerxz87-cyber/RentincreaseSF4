name: Validate static research site
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py
      - run: python scripts/validate_site.py
      - run: python research/t51_external_audit/test_privacy_guard.py
      - name: Confirm generated outputs are committed
        run: git diff --exit-code
